[project]
name = "overkill"
version = "0.2.1"
description = "AI-powered code review loop — automates Codex review + Claude fix cycles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "ModocAI" }]
keywords = ["code-review", "refactoring", "ai", "claude", "codex", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/modocai/mr-overkill"
Issues = "https://github.com/modocai/mr-overkill/issues"

[project.scripts]
overkill = "mr_overkill.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mr_overkill"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/active" = "mr_overkill/data/prompts/active"
".reviewlooprc.example" = "mr_overkill/data/.reviewlooprc.example"
".refactorsuggestrc.example" = "mr_overkill/data/.refactorsuggestrc.example"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
]
